<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Éléments décoratifs d'arrière-plan */
        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.08) 2px, transparent 2px);
            background-size: 60px 60px;
            animation: float 25s infinite linear;
            z-index: -1;
        }

        body::after {
            content: '';
            position: absolute;
            bottom: 10%;
            left: 15%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255,255,255,0.15), transparent 60%);
            border-radius: 50%;
            animation: breathe 6s infinite ease-in-out;
            z-index: -1;
        }

        @keyframes float {
            0% { transform: translateX(0) translateY(0) rotate(0deg); }
            100% { transform: translateX(-60px) translateY(-60px) rotate(360deg); }
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.3; }
            50% { transform: scale(1.3) rotate(180deg); opacity: 0.7; }
        }

        .register-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 480px;
            width: 100%;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .register-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #38a169, #667eea, transparent);
            animation: shimmer 4s infinite;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .register-container:hover {
            transform: translateY(-8px);
            box-shadow: 0 35px 70px rgba(0, 0, 0, 0.15);
        }

        h2 {
            color: #2d3748;
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 35px;
            text-align: center;
            background: linear-gradient(135deg, #38a169, #667eea);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
        }

        h2::before {
            content: '👋';
            display: block;
            font-size: 3rem;
            margin-bottom: 15px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1));
            animation: wave 2s infinite ease-in-out;
        }

        @keyframes wave {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(20deg); }
            75% { transform: rotate(-20deg); }
        }

        form {
            margin-bottom: 30px;
        }

        /* Styling des champs de formulaire Django */
        form p {
            margin-bottom: 25px;
            position: relative;
        }

        form label {
            display: block;
            color: #4a5568;
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            position: relative;
        }

        form label::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #38a169, #667eea);
            transition: width 0.3s ease;
        }

        form input[type="text"],
        form input[type="email"],
        form input[type="password"] {
            width: 100%;
            padding: 18px 24px;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            font-size: 16px;
            font-family: inherit;
            background: #ffffff;
            transition: all 0.3s ease;
            outline: none;
            position: relative;
        }

        form input[type="text"]:focus,
        form input[type="email"]:focus,
        form input[type="password"]:focus {
            border-color: #38a169;
            box-shadow: 0 0 0 4px rgba(56, 161, 105, 0.1);
            transform: translateY(-2px);
            background: linear-gradient(135deg, #ffffff 0%, #f0fff4 100%);
        }

        form input[type="text"]:focus ~ label::after,
        form input[type="email"]:focus ~ label::after,
        form input[type="password"]:focus ~ label::after {
            width: 100%;
        }

        form input[type="text"]:focus ~ label,
        form input[type="email"]:focus ~ label,
        form input[type="password"]:focus ~ label {
            color: #38a169;
            transform: translateY(-2px);
        }

        /* Messages d'aide et d'erreur Django */
        .helptext {
            font-size: 13px;
            color: #718096;
            margin-top: 8px;
            font-style: italic;
            padding: 10px 14px;
            background: rgba(113, 128, 150, 0.08);
            border-radius: 10px;
            border-left: 3px solid #718096;
            position: relative;
        }

        .helptext::before {
            content: '💡';
            margin-right: 8px;
        }

        .errorlist {
            list-style: none;
            margin: 8px 0 0 0;
        }

        .errorlist li {
            color: #e53e3e;
            font-size: 14px;
            background: rgba(229, 62, 62, 0.1);
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 8px;
            border-left: 4px solid #e53e3e;
            font-weight: 500;
            animation: slideInError 0.5s ease-out;
            position: relative;
        }

        .errorlist li::before {
            content: '⚠️';
            margin-right: 8px;
        }

        @keyframes slideInError {
            0% { 
                opacity: 0;
                transform: translateX(-20px);
            }
            100% { 
                opacity: 1;
                transform: translateX(0);
            }
        }

        button {
            background: linear-gradient(135deg, #38a169 0%, #667eea 100%);
            color: white;
            border: none;
            padding: 18px 36px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(56, 161, 105, 0.4);
            position: relative;
            overflow: hidden;
            width: 100%;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        button:hover::before {
            left: 100%;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(56, 161, 105, 0.6);
            background: linear-gradient(135deg, #2f855a 0%, #5a67d8 100%);
        }

        button:active {
            transform: translateY(-1px);
        }

        /* Lien de connexion */
        a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            padding: 16px 24px;
            border-radius: 16px;
            transition: all 0.3s ease;
            background: rgba(102, 126, 234, 0.1);
            width: 100%;
            text-align: center;
            border: 2px solid transparent;
            position: relative;
            overflow: hidden;
        }

        a::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(102, 126, 234, 0.1), transparent);
            transition: left 0.6s;
        }

        a:hover::before {
            left: 100%;
        }

        a:hover {
            background: rgba(102, 126, 234, 0.2);
            transform: translateY(-2px);
            border-color: rgba(102, 126, 234, 0.3);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.2);
        }

        a::after {
            content: '←';
            font-size: 1.2em;
            transition: transform 0.3s ease;
        }

        a:hover::after {
            transform: translateX(-5px);
        }

        /* Responsive design */
        @media (max-width: 480px) {
            .register-container {
                padding: 30px 20px;
                margin: 10px;
            }
            
            h2 {
                font-size: 1.8rem;
            }

            h2::before {
                font-size: 2.5rem;
            }
            
            form input[type="text"],
            form input[type="email"],
            form input[type="password"],
            button,
            a {
                padding: 16px 20px;
                font-size: 15px;
            }
        }

        /* Animation d'entrée */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(50px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .register-container {
            animation: slideIn 0.8s ease-out;
        }

        /* Indicateur de force du mot de passe */
        .password-strength {
            margin-top: 8px;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 500;
            text-align: center;
            transition: all 0.3s ease;
        }

        /* Effet de particules sur le bouton */
        button:hover::after {
            content: '✨';
            position: absolute;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            animation: sparkle 1s infinite;
        }

        @keyframes sparkle {
            0%, 100% { opacity: 0; transform: translateY(-50%) scale(0.5); }
            50% { opacity: 1; transform: translateY(-50%) scale(1); }
        }

        /* Effet de typing pour le placeholder */
        form input::placeholder {
            color: #a0aec0;
            transition: color 0.3s ease;
        }

        form input:focus::placeholder {
            color: transparent;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <h2>Inscription</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">S'inscrire</button>
        </form>
        <a href="{% url 'login' %}">Déjà inscrit ? Se connecter</a>
    </div>
</body>
</html>
