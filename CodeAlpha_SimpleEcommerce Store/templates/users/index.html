<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentification</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Éléments décoratifs d'arrière-plan */
        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: float 20s infinite linear;
            z-index: -1;
        }

        @keyframes float {
            0% { transform: translateX(0) translateY(0); }
            100% { transform: translateX(-50px) translateY(-50px); }
        }

        .auth-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 450px;
            width: 100%;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .auth-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #667eea, transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .auth-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.15);
        }

        h2 {
            color: #2d3748;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 30px;
            text-align: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            position: relative;
        }

        /* Icônes pour les titres */
        .login-title::before {
            content: '🔐';
            display: block;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .signup-title::before {
            content: '👋';
            display: block;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .welcome-title::before {
            content: '🎉';
            display: block;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        form {
            margin-bottom: 30px;
        }

        /* Styling des champs de formulaire Django */
        form p {
            margin-bottom: 20px;
        }

        form label {
            display: block;
            color: #4a5568;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        form input[type="text"],
        form input[type="email"],
        form input[type="password"] {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            font-size: 16px;
            font-family: inherit;
            background: #ffffff;
            transition: all 0.3s ease;
            outline: none;
        }

        form input[type="text"]:focus,
        form input[type="email"]:focus,
        form input[type="password"]:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
            transform: translateY(-2px);
        }

        /* Messages d'aide et d'erreur Django */
        .helptext {
            font-size: 12px;
            color: #718096;
            margin-top: 5px;
            font-style: italic;
        }

        .errorlist {
            list-style: none;
            margin: 5px 0;
        }

        .errorlist li {
            color: #e53e3e;
            font-size: 14px;
            background: rgba(229, 62, 62, 0.1);
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 5px;
            border-left: 3px solid #e53e3e;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            position: relative;
            overflow: hidden;
            width: 100%;
            margin-bottom: 20px;
        }

        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        button:hover::before {
            left: 100%;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.6);
        }

        button:active {
            transform: translateY(-1px);
        }

        /* Liens de navigation */
        a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            padding: 12px 20px;
            border-radius: 12px;
            transition: all 0.3s ease;
            background: rgba(102, 126, 234, 0.1);
            margin: 5px;
            text-align: center;
            justify-content: center;
        }

        a:hover {
            background: rgba(102, 126, 234, 0.2);
            transform: translateY(-2px);
        }

        /* Lien de déconnexion en rouge */
        a[href*="logout"] {
            background: rgba(229, 62, 62, 0.1);
            color: #e53e3e;
        }

        a[href*="logout"]:hover {
            background: rgba(229, 62, 62, 0.2);
        }

        /* Style pour la page d'accueil */
        .welcome-message {
            text-align: center;
            margin-bottom: 30px;
        }

        .welcome-message p {
            font-size: 1.2rem;
            color: #4a5568;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .username {
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
        }

        /* Responsive design */
        @media (max-width: 480px) {
            .auth-container {
                padding: 24px;
                margin: 10px;
            }
            
            h2 {
                font-size: 1.5rem;
            }
            
            form input[type="text"],
            form input[type="email"],
            form input[type="password"],
            button {
                padding: 14px 16px;
            }
        }

        /* Animation d'entrée */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .auth-container {
            animation: slideIn 0.6s ease-out;
        }

        /* Conteneur pour les liens multiples */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        @media (min-width: 480px) {
            .links-container {
                flex-direction: row;
                justify-content: space-between;
            }
        }
    </style>
</head>
<body>
    <!-- PAGE DE CONNEXION -->
    <div class="auth-container" id="login-page" style="display: block;">
        <h2 class="login-title">Connexion</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Se connecter</button>
        </form>
        <div class="links-container">
            <a href="{% url 'signup' %}">Créer un compte</a>
            <a href="{% url 'logout' %}">Déconnexion</a>
        </div>
    </div>

    <!-- PAGE D'INSCRIPTION -->
    <div class="auth-container" id="signup-page" style="display: none;">
        <h2 class="signup-title">Inscription</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">S'inscrire</button>
        </form>
        <a href="{% url 'login' %}">Déjà un compte ? Se connecter</a>
    </div>

    <!-- PAGE D'ACCUEIL -->
    <div class="auth-container" id="home-page" style="display: none;">
        <h2 class="welcome-title">Bienvenue sur la plateforme sociale !</h2>
        <div class="welcome-message">
            <p>Bonjour <span class="username">{{ user.username }}</span> !</p>
        </div>
        <a href="{% url 'logout' %}">Déconnexion</a>
    </div>

    <script>
        // Script pour prévisualiser les différentes pages (à supprimer en production)
        function showPage(pageId) {
            document.querySelectorAll('.auth-container').forEach(container => {
                container.style.display = 'none';
            });
            document.getElementById(pageId).style.display = 'block';
        }

        // Cycle automatique pour la démo (à supprimer en production)
        let currentPage = 0;
        const pages = ['login-page', 'signup-page', 'home-page'];
        
        setInterval(() => {
            currentPage = (currentPage + 1) % pages.length;
            showPage(pages[currentPage]);
        }, 5000);
    </script>
</body>
</html>
